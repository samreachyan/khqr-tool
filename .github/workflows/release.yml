name: Release

# Merging into main cuts a release: bump the version, tag it, build native installers
# for macOS (dmg) and Linux (deb + rpm), and publish them to a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to use if no conventional-commit keywords are found"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Only one release runs at a time; never cancel one that's already tagging/publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Computes the next semver version from conventional-commit messages since the last
  # `v*` tag (feat -> minor, fix/other -> patch, BREAKING CHANGE / "!" -> major), then
  # pushes that tag. Add "[skip release]" or "[skip ci]" to a commit message to opt out.
  tag:
    if: >-
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: ${{ github.event.inputs.bump || 'patch' }}
          release_branches: main

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            installer: dmg
          - os: ubuntu-latest
            installer: deb
          - os: ubuntu-latest
            installer: rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # jpackage shells out to rpmbuild for --type rpm; Ubuntu runners don't ship it.
      - name: Install rpmbuild
        if: matrix.installer == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build ${{ matrix.installer }} installer
        run: >-
          ./gradlew jpackageInstaller
          -Pversion=${{ needs.tag.outputs.new_version }}
          -PinstallerType=${{ matrix.installer }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: khqr-tool-${{ needs.tag.outputs.new_version }}-${{ matrix.installer }}
          path: build/dist/*.${{ matrix.installer }}
          if-no-files-found: error

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          files: dist/*
