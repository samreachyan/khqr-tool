import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.11'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.sakcode'
// `-Pversion=1.2.3` on the CLI (used by the release workflow) takes precedence over this default.
version = project.findProperty('version') ?: '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    // Remove mainModule - we're not using module system
    mainClass = 'com.sakcode.decodekhqr.MainKHQRApplication'
    applicationDefaultJvmArgs = [
        '-Xdock:name=KHQR Tool',
        '-Dapple.awt.application.name=KHQR Tool'
    ]
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'kh.gov.nbc.bakong_khqr:sdk-java:1.0.0.16'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation 'org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0'
    implementation 'org.openpnp:opencv:4.9.0-0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

test {
    useJUnitPlatform()
}

// Configure the run task for development
run {
    def iconPath = file('src/main/resources/app_icon.png').absolutePath
    // Add JavaFX modules to module path
    jvmArgs = [
            '--module-path', "${System.getProperty('java.home')}/lib",
            '--add-modules', 'javafx.controls,javafx.fxml',
            '-Xdock:icon=' + iconPath,
            '-Xdock:name=KHQR Tool',
            '-Dapple.awt.application.name=KHQR Tool'
    ]
    // Set the classpath to include all dependencies
    classpath = sourceSets.main.runtimeClasspath
}

// Configure shadow JAR for production
shadowJar {
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': 'com.sakcode.decodekhqr.MainKHQRApplication'
    }
    mergeServiceFiles()

    // Exclude module-info to avoid conflicts
    exclude 'module-info.class'

    // Ensure all dependencies are included (including transitive deps)
    dependencies {
        include(dependency('kh.gov.nbc.bakong_khqr:sdk-java:1.0.0.16'))
        include(dependency('com.google.zxing:core:3.5.3'))
        include(dependency('org.apache.commons:commons-lang3:3.20.0'))
        include(dependency('com.fasterxml.jackson.core:jackson-databind:2.18.3'))
        include(dependency('com.fasterxml.jackson.core:jackson-core:2.18.3'))
        include(dependency('com.fasterxml.jackson.core:jackson-annotations:2.18.3'))
        include(dependency('org.controlsfx:controlsfx:11.1.2'))
        include(dependency('org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0'))
        include(dependency('org.openpnp:opencv:4.9.0-0'))
    }
}

// Alternative: Create a fat JAR without shadow plugin
task fatJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'com.sakcode.decodekhqr.MainKHQRApplication'
    }
    archiveClassifier = 'all'
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ── Native macOS .app packaging via jpackage ──────────────────────────────────
// Prerequisites: JDK 21+, shadowJar must be built first.
// Usage: ./gradlew packageMacApp
// Output: build/dist/KHQR-Tool.app
task packageMacApp(type: Exec) {
    dependsOn shadowJar

    def appName    = 'KHQR-Tool'
    def jarFile    = shadowJar.archiveFile.get().asFile
    def iconFile   = file('src/main/resources/app_icon.icns')
    def destDir    = file("${buildDir}/dist")

    // JavaFX SDK module JARs — must be on the module path (not classpath)
    // Stored in project-local lib/ directory (portable, no Gradle cache dependency)
    def javafxLibDir = file("${projectDir}/lib")
    def javafxModules = [
            "${javafxLibDir}/javafx-base-21-mac-aarch64.jar",
            "${javafxLibDir}/javafx-controls-21-mac-aarch64.jar",
            "${javafxLibDir}/javafx-graphics-21-mac-aarch64.jar",
            "${javafxLibDir}/javafx-fxml-21-mac-aarch64.jar"
    ]

    doFirst {
        destDir.mkdirs()
    }

    commandLine = [
            'jpackage',
            '--type', 'app-image',
            '--name', appName,
            '--app-version', '1.0',
            '--icon', iconFile.absolutePath,
            '--input', jarFile.parent,
            '--main-jar', jarFile.name,
            '--main-class', 'com.sakcode.decodekhqr.MainKHQRApplication',
            '--module-path', javafxModules.join(File.pathSeparator),
            '--add-modules', 'javafx.controls,javafx.fxml',
            '--dest', destDir.absolutePath
    ]
}

// Convenience: build .app then open the result in Finder
task macApp(dependsOn: packageMacApp) {
    doLast {
        println "\n✅ Built: build/dist/KHQR-Tool.app"
    }
}

// ── Cross-platform native installer via jpackage (used by CI/CD) ─────────────
// Unlike packageMacApp above (which needs the JavaFX jars committed under lib/),
// this reuses the JavaFX module jars the javafx {} block already resolved onto
// runtimeClasspath for the *current* host platform/arch, so the same task works
// unmodified on macOS and Linux runners without committing per-platform jars.
//
// Usage: ./gradlew jpackageInstaller -Pversion=1.2.3 -PinstallerType=dmg|deb|rpm
task jpackageInstaller(type: Exec) {
    group = 'distribution'
    description = 'Builds a native installer (dmg on macOS, deb/rpm on Linux) with jpackage.'
    dependsOn shadowJar

    def appName = 'KHQR-Tool'
    def appVersion = project.version.toString()
    def destDir = file("${buildDir}/dist")
    def type = (project.findProperty('installerType')
            ?: (OperatingSystem.current().isMacOsX() ? 'dmg' : 'deb')).toString()
    def iconFile = type == 'dmg'
            ? file('src/main/resources/app_icon.icns')
            : file('src/main/resources/app_icon.png')

    doFirst {
        if (!(appVersion ==~ /\d+(\.\d+){1,2}/)) {
            throw new GradleException("jpackage needs a numeric x.y[.z] --app-version, got '${appVersion}'. " +
                    "Pass one explicitly, e.g. ./gradlew jpackageInstaller -Pversion=1.2.3")
        }
        destDir.mkdirs()

        def jarFile = shadowJar.archiveFile.get().asFile
        def javafxModulePath = configurations.runtimeClasspath.files
                .findAll { it.name.startsWith('javafx-') }
                .collect { it.absolutePath }
        if (javafxModulePath.isEmpty()) {
            throw new GradleException("No javafx-*.jar found on runtimeClasspath for this platform/arch")
        }

        commandLine = [
                'jpackage',
                '--type', type,
                '--name', appName,
                '--app-version', appVersion,
                '--vendor', 'SAK Code',
                '--description', 'Generate and decode Bakong KHQR codes',
                '--icon', iconFile.absolutePath,
                '--input', jarFile.parent,
                '--main-jar', jarFile.name,
                '--main-class', 'com.sakcode.decodekhqr.MainKHQRApplication',
                '--module-path', javafxModulePath.join(File.pathSeparator),
                '--add-modules', 'javafx.controls,javafx.fxml',
                '--dest', destDir.absolutePath
        ]
        if (type == 'deb' || type == 'rpm') {
            commandLine += ['--linux-shortcut', '--linux-menu-group', 'Utility']
        }
    }

    // Placeholder so Gradle accepts the Exec task before doFirst rewrites it above.
    commandLine = ['jpackage', '--version']
}
